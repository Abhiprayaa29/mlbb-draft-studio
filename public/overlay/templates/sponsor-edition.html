<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>MLBB Esports Overlay — Sponsor Edition</title>
  <style>
    :root {
      /* Edit these variables to tune the original palette. */
      --black: #050808;
      --navy: #172638;
      --navy-deep: #101b28;
      --red: #7c2027;
      --red-deep: #4b171e;
      --green: #244334;
      --green-deep: #142b22;
      --teal: #5ab8b7;
      --teal-dark: #2c777c;
      --gold: #e1aa2b;
      --gold-light: #f4c84b;
      --line-width: 2.5px;
    }

    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent !important;
    }
    body { isolation: isolate; }
    .overlay {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      overflow: hidden;
      pointer-events: none;
      background: transparent;
    }
    .hairline { vector-effect: non-scaling-stroke; }
    .soft-breathe { animation: breathe 8s ease-in-out infinite; }
    @keyframes breathe {
      0%, 100% { opacity: .62; }
      50% { opacity: .92; }
    }
    @media (prefers-reduced-motion: reduce) {
      .soft-breathe { animation: none; }
    }
  </style>
</head>
